name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ALL-FOR-ONE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ALL-FOR-ONE-apk
          path: ALL-FOR-ONE.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ALL FOR ONE build ${{ github.run_number }}
          files: ALL-FOR-ONE.apk
          make_latest: true
