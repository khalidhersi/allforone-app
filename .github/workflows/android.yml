name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Server tests
        run: node tools/test_server.js

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Use the signing key from GitHub secrets, if set
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk ALL-FOR-ONE.apk

      - name: Check the APK
        run: bash tools/apk_check.sh

      - name: Check the marketplace links
        run: bash tools/check_links.sh

      - name: Get the previous version to compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download --repo "$GITHUB_REPOSITORY" --pattern ALL-FOR-ONE.apk --dir prev || true

      - name: Enable the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an Android 14 emulator
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/android_smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ALL-FOR-ONE-apk
          path: ALL-FOR-ONE.apk

      - name: Publish the download
        if: steps.smoke.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ALL FOR ONE build ${{ github.run_number }}
          body_path: smoke-report.txt
          files: |
            ALL-FOR-ONE.apk
            smoke-report.txt
            smoke-screen.png
            smoke-logcat.txt
          make_latest: true

      - name: Publish the failed test report (not for download)
        if: steps.smoke.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failed-test-${{ github.run_number }}
          name: "FAILED TEST, build ${{ github.run_number }} (don't install)"
          body_path: smoke-report.txt
          prerelease: true
          make_latest: false
          files: |
            smoke-report.txt
            smoke-screen.png
            smoke-logcat.txt

      - name: Stop if the emulator test failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
